name: Build TWRP (iflytek ctg3 / T20Pro)

# 只在 master 上构建，main 保持不动
on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - 'LICENSE*'
  workflow_dispatch:
    inputs:
      manifest_branch:
        description: 'TWRP minimal manifest 分支'
        required: false
        default: 'twrp-12.1'
      device_branch:
        description: '设备树分支'
        required: false
        default: 'master'
      jobs:
        description: '编译并行度（留空 = nproc）'
        required: false
        default: ''
      stock_boot_url:
        description: '（可选）当前固件 boot.img 直链：给了就用它里的 kernel/dtb 覆盖 prebuilt'
        required: false
        default: ''
      stock_dtbo_url:
        description: '（可选）当前固件 dtbo.img 直链：给了就覆盖 prebuilt/dtbo.img'
        required: false
        default: ''
      variant:
        description: '产物类型：recovery（独立 recovery 分区）或 boot（塞进 boot 分区）'
        required: false
        default: 'recovery'

concurrency:
  group: twrp-ctg3-${{ github.ref }}
  cancel-in-progress: true

env:
  MANIFEST_URL: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git
  MANIFEST_BRANCH: ${{ github.event.inputs.manifest_branch || 'twrp-12.1' }}
  DEVICE_BRANCH: ${{ github.event.inputs.device_branch || 'master' }}
  LUNCH_TARGET: ctg3-eng
  VARIANT: ${{ github.event.inputs.variant || 'recovery' }}
  TZ: UTC

jobs:
  build:
    name: TWRP 12.1 / ctg3 / ${{ github.event.inputs.variant || 'recovery' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    steps:
      - name: 环境信息
        run: |
          echo "repo      : ${{ github.repository }} @ ${{ github.ref_name }}"
          echo "manifest  : $MANIFEST_URL -b $MANIFEST_BRANCH"
          echo "devicetree: $DEVICE_BRANCH"
          echo "variant   : $VARIANT"
          nproc; free -h; df -h /

      - name: 释放磁盘空间
        run: |
          set -x
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/local/lib/R/site-library 2>/dev/null || true
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: 安装编译依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib git \
            gnupg gperf imagemagick libelf-dev liblz4-tool libncurses5 libncurses5-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev unzip python3 python-is-python3 || \
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex git gperf libelf-dev libssl-dev \
            libxml2 libxml2-utils lzop rsync squashfs-tools xsltproc zip zlib1g-dev \
            unzip python3
          sudo apt-get install -y --no-install-recommends openjdk-11-jdk-headless || true

      - name: 安装 repo
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: 配置 git
        run: |
          git config --global user.name  "TWRP Builder"
          git config --global user.email "builder@localhost"
          git config --global color.ui false

      - name: repo init
        run: |
          SRC="$GITHUB_WORKSPACE/android"
          mkdir -p "$SRC" && cd "$SRC"
          repo init --depth=1 --no-repo-verify \
            -u "$MANIFEST_URL" -b "$MANIFEST_BRANCH"
          du -sh .repo

      - name: repo sync（约 20-30GB，10-25 分钟）
        run: |
          set -o pipefail
          SRC="$GITHUB_WORKSPACE/android"
          cd "$SRC"
          for i in 1 2 3; do
            echo "=== sync attempt $i ==="
            if repo sync -c --force-sync --no-clone-bundle --no-tags \
                 -j"$(nproc)" --optimized-fetch 2>&1 | tee "sync.log" | tail -n 5; then
              break
            fi
            echo "sync 失败，20s 后重试"; sleep 20
          done
          git -C .repo/manifests rev-parse HEAD || true
          df -h /
          du -sh "$SRC"
          AVAIL=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          echo "剩余磁盘: ${AVAIL}G"
          if [ "$AVAIL" -lt 35 ]; then echo "::error::磁盘不足 35G，继续会中途失败"; exit 1; fi

      - name: 放入设备树
        run: |
          SRC="$GITHUB_WORKSPACE/android"
          DEST="$SRC/device/iflytek/ctg3"
          mkdir -p "$(dirname "$DEST")"
          git clone --depth 1 -b "$DEVICE_BRANCH" \
            "https://github.com/${{ github.repository }}.git" "$DEST"
          rm -rf "$DEST/.git"
          echo "--- 设备树内容 ---"
          ls -la "$DEST"
          ls -la "$DEST/prebuilt" || echo "!! 警告：prebuilt 目录缺失，本次构建大概率失败"

      - name: 用当前固件刷新 prebuilt（kernel / dtb / dtbo）
        if: ${{ github.event.inputs.stock_boot_url != '' }}
        run: |
          SRC="$GITHUB_WORKSPACE/android"
          DEST="$SRC/device/iflytek/ctg3"
          cd "$GITHUB_WORKSPACE"
          curl -fsSL "${{ github.event.inputs.stock_boot_url }}" -o stock-boot.img
          ls -l stock-boot.img
          DTBO_ARG=""
          if [ -n "${{ github.event.inputs.stock_dtbo_url }}" ]; then
            curl -fsSL "${{ github.event.inputs.stock_dtbo_url }}" -o stock-dtbo.img
            ls -l stock-dtbo.img
            DTBO_ARG="--dtbo $GITHUB_WORKSPACE/stock-dtbo.img"
          fi
          echo "===== 分析（不写入）====="
          python3 "$GITHUB_WORKSPACE/tools/reprebuilt.py" stock-boot.img --device-dir "$DEST" $DTBO_ARG || true
          python3 "$GITHUB_WORKSPACE/tools/reprebuilt.py" stock-boot.img --device-dir "$DEST" $DTBO_ARG --apply \
            | tee "$GITHUB_WORKSPACE/reprebuilt.log"
          {
            echo "### prebuilt 刷新结果"
            echo '```'
            cat "$GITHUB_WORKSPACE/reprebuilt.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 编译（recovery 或 boot）
        run: |
          SRC="$GITHUB_WORKSPACE/android"
          LOG="$GITHUB_WORKSPACE/build.log"
          LUNCHLOG="$GITHUB_WORKSPACE/lunch.log"
          DEST="$SRC/device/iflytek/ctg3"
          cd "$SRC"
          set -o pipefail
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          export TARGET_RECOVERY_DEVICE_DIR="$DEST"

          if [ "$VARIANT" = "boot" ]; then
            echo "==> variant=boot：把 recovery ramdisk 打进 boot 分区（绕过 recovery 引导路径）"
            printf '\n# --- CI 追加：TWRP as boot ---\nBOARD_USES_RECOVERY_AS_BOOT := true\n' >> "$DEST/BoardConfig.mk"
            TARGET_IMG=bootimage
          else
            TARGET_IMG=recoveryimage
          fi

          # 注意：lunch 必须直接调用，不能放进管道/命令替换，否则 export 会丢
          set +e
          lunch "$LUNCH_TARGET" > "$LUNCHLOG" 2>&1
          rc=$?
          set -e
          tail -n 25 "$LUNCHLOG"
          if [ $rc -ne 0 ]; then
            echo "lunch $LUNCH_TARGET 失败(rc=$rc)，尝试 twrp_ctg3-eng"
            lunch twrp_ctg3-eng
          fi

          echo "TARGET_PRODUCT=$TARGET_PRODUCT  TARGET_DEVICE=$(get_build_var TARGET_DEVICE)  TARGET_ARCH=$(get_build_var TARGET_ARCH)"
          if [ "$TARGET_PRODUCT" != "ctg3" ]; then
            echo "::error::lunch 没有选中 ctg3（当前 '$TARGET_PRODUCT'），终止，避免白跑几小时"
            exit 1
          fi

          JOBS="${{ github.event.inputs.jobs }}"
          [ -z "$JOBS" ] && JOBS=$(nproc)
          echo "并行度: $JOBS  目标: $TARGET_IMG"
          set +e
          make -j"$JOBS" "$TARGET_IMG" 2>&1 | tee "$LOG"
          rc=${PIPESTATUS[0]}
          set -e
          if [ $rc -ne 0 ]; then
            echo "::error::make 失败 (rc=$rc)"
            {
              echo "### 关键错误行"
              echo '```'
              grep -nE "error:|Error [0-9]+|FAILED:|ninja: build stopped|No rule to make|Killed|out of memory" "$LOG" | head -n 60
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit $rc
          fi

      - name: 结果信息
        if: success()
        run: |
          OUT="$GITHUB_WORKSPACE/android/out/target/product/ctg3"
          ls -la "$OUT"/*.img 2>/dev/null || true
          cd "$OUT" && sha256sum *.img 2>/dev/null | tee "$GITHUB_WORKSPACE/sha256.txt" || true
          df -h /

      - name: 上传产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-ctg3-${{ github.event.inputs.variant || 'recovery' }}
          path: |
            android/out/target/product/ctg3/recovery.img
            android/out/target/product/ctg3/boot.img
            android/out/target/product/ctg3/dtbo.img
            sha256.txt
          if-no-files-found: warn
          retention-days: 30

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            android/sync.log
            reprebuild.log
          if-no-files-found: ignore
          retention-days: 14
